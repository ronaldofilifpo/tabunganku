<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabungKu - Pencatat Tabungan & Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- Header Aplikasi -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i> TabungKu
                </h1>
                <p class="text-xs text-blue-100">Sinkronisasi Cloud via Kode Room</p>
            </div>
            <button onclick="changeRoomId()" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-1.5 rounded-lg border border-blue-500 transition">
                <i class="fa-solid fa-key"></i> Ganti Room
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Info Room Aktif -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-sm">
            <span class="text-slate-500">Room Aktif:</span>
            <span id="currentRoomDisplay" class="font-bold text-blue-600 uppercase tracking-wider"></span>
        </div>

        <!-- Ringkasan Saldo -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-5 rounded-2xl shadow-lg">
            <p class="text-xs text-blue-100 uppercase tracking-wider">Total Saldo Tersimpan</p>
            <h2 id="totalBalance" class="text-3xl font-extrabold mt-1">Rp 0</h2>
        </div>

        <!-- Tombol Aksi -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-xl font-medium shadow transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Tambah Transaksi
            </button>
            <button onclick="syncDataFromCloud()" class="bg-white hover:bg-slate-100 text-blue-600 border border-blue-200 py-3 px-4 rounded-xl font-medium shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-sync"></i> Sinkronkan
            </button>
        </div>

        <!-- Daftar Transaksi -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-700 mb-3 flex items-center justify-between">
                <span>Riwayat Transaksi</span>
                <span id="txCount" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">0 item</span>
            </h3>
            <div id="transactionList" class="divide-y divide-slate-100 max-h-96 overflow-y-auto space-y-2">
                <!-- Data transaksi akan dimuat secara dinamis di sini -->
                <p class="text-center text-slate-400 py-4 text-sm">Belum ada data transaksi.</p>
            </div>
        </div>
    </main>

    <!-- Modal Tambah Transaksi -->
    <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">Tambah Transaksi Baru</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>
            <form id="txForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah (Rp)</label>
                    <input type="number" id="txAmount" required placeholder="Contoh: 50000" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
                    <select id="txCategory" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                        <option value="Pemasukan">Pemasukan</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                        <option value="Tabungan">Tabungan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Catatan</label>
                    <input type="text" id="txNote" placeholder="Keterangan opsional" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-medium text-sm transition">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-medium text-sm transition">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika & Cloud Sync -->
    <script>
        // Masukkan URL Web App Google Apps Script Anda yang berakhiran /exec di sini:
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxpGvglQgOdNCCrEyWP705W78q91eHFea9B9kcyNuvDUk7s754lo7CEQ1qHWAs89KiF/exec';
        
        let transactions = [];

        // Manajemen Kode Room
        function getRoomId() {
            let roomId = localStorage.getItem('tabungku_room_id');
            if (!roomId) {
                roomId = prompt('Masukkan Kode Room (contoh: RUMAH123) untuk menghubungkan HP 1 & HP 2:');
                if (roomId) {
                    roomId = roomId.trim().toUpperCase();
                    localStorage.setItem('tabungku_room_id', roomId);
                } else {
                    roomId = 'DEFAULT-ROOM';
                    localStorage.setItem('tabungku_room_id', roomId);
                }
            }
            document.getElementById('currentRoomDisplay').innerText = roomId;
            return roomId;
        }

        function changeRoomId() {
            let currentRoom = localStorage.getItem('tabungku_room_id') || '';
            let newRoom = prompt('Masukkan Kode Room Baru:', currentRoom);
            if (newRoom && newRoom.trim() !== '') {
                localStorage.setItem('tabungku_room_id', newRoom.trim().toUpperCase());
                document.getElementById('currentRoomDisplay').innerText = localStorage.getItem('tabungku_room_id');
                syncDataFromCloud();
            }
        }

        // Inisialisasi Tampilan Aplikasi & Simpan ke Memori Lokal HP
        function initApp() {
            const listEl = document.getElementById('transactionList');
            const balanceEl = document.getElementById('totalBalance');
            const countEl = document.getElementById('txCount');
            
            listEl.innerHTML = '';
            let total = 0;
            
            // Simpan ke localStorage agar aman saat refresh
            localStorage.setItem('tabungku_transactions', JSON.stringify(transactions));

            if (!Array.isArray(transactions) || transactions.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-4 text-sm">Belum ada data transaksi di room ini.</p>`;
                balanceEl.innerText = 'Rp 0';
                countEl.innerText = '0 item';
                return;
            }

            countEl.innerText = `${transactions.length} item`;

            transactions.forEach(tx => {
                let amountNum = Number(tx.amount) || 0;
                if (tx.category === 'Pemasukan' || tx.category === 'Tabungan') {
                    total += amountNum;
                } else {
                    total -= amountNum;
                }

                let itemHTML = `
                    <div class="py-2.5 flex justify-between items-center text-sm">
                        <div>
                            <p class="font-semibold text-slate-800">${tx.note || tx.category || 'Transaksi'}</p>
                            <p class="text-xs text-slate-400">${new Date(tx.date).toLocaleDateString('id-ID')} • <span class="text-blue-500 font-medium">${tx.category}</span></p>
                        </div>
                        <span class="font-bold ${tx.category === 'Pengeluaran' ? 'text-red-500' : 'text-emerald-600'}">
                            ${tx.category === 'Pengeluaran' ? '-' : '+'} Rp ${amountNum.toLocaleString('id-ID')}
                        </span>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });

            balanceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // Ambil Data dari Cloud & Sinkronkan dengan Memori Lokal
        async function syncDataFromCloud() {
            const roomId = getRoomId();
            if (!WEB_APP_URL || WEB_APP_URL.includes('MASUKKAN_URL')) return;

            try {
                let response = await fetch(`${WEB_APP_URL}?roomId=${encodeURIComponent(roomId)}&t=${new Date().getTime()}`);
                let result = await response.json();

                if (Array.isArray(result) && result.length > 0) {
                    transactions = result;
                } else {
                    let localData = localStorage.getItem('tabungku_transactions');
                    if (localData) {
                        transactions = JSON.parse(localData);
                    }
                }
                initApp();
            } catch (error) {
                console.error('Gagal mengambil data dari cloud, memuat data lokal:', error);
                let localData = localStorage.getItem('tabungku_transactions');
                if (localData) {
                    transactions = JSON.parse(localData);
                    initApp();
                }
            }
        }

        // Kirim Transaksi Baru ke Cloud Room
        async function saveTransactionToCloud(txData) {
            const roomId = getRoomId();
            if (!WEB_APP_URL) return;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomId: roomId,
                        ...txData
                    })
                });
                setTimeout(syncDataFromCloud, 1200);
            } catch (error) {
                console.error('Gagal menyimpan ke cloud:', error);
            }
        }

        // Modal Kontrol
        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('txForm').reset();
        }

        // Handle Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();
            const amount = document.getElementById('txAmount').value;
            const category = document.getElementById('txCategory').value;
            const note = document.getElementById('txNote').value;

            const newTx = {
                id: 'tx_' + new Date().getTime(),
                date: new Date().toISOString(),
                amount: Number(amount),
                category: category,
                note: note || category
            };

            transactions.push(newTx);
            localStorage.setItem('tabungku_transactions', JSON.stringify(transactions));
            
            initApp();
            saveTransactionToCloud(newTx);
            closeAddModal();
        }

        // Jalankan saat halaman dimuat pertama kali
        document.addEventListener('DOMContentLoaded', () => {
            getRoomId();
            let localData = localStorage.getItem('tabungku_transactions');
            if (localData) {
                transactions = JSON.parse(localData);
                initApp();
            }
            syncDataFromCloud();
        });

        // Auto sync saat berpindah layar / membuka kembali aplikasi di HP
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                syncDataFromCloud();
            }
        });
    </script>
</body>
</html>
