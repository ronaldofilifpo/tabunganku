<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabunganKita - Live Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg text-white flex items-center gap-2">
                <i class="fa-solid fa-wallet text-blue-500"></i> TabunganKita
            </h1>
            <p class="text-xs text-emerald-400 font-medium">● Real-time Sync Aktif</p>
        </div>
        <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
            <span class="text-slate-400">Room:</span> <span id="room-badge" class="font-bold text-blue-400">...</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Ubah Room Code -->
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex gap-2">
            <input type="text" id="input-room" placeholder="Ketik Kode Room (Contoh: RUMAH123)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs uppercase font-mono text-white focus:outline-none focus:border-blue-500">
            <button onclick="changeRoom()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">Ganti</button>
        </div>

        <!-- Total Saldo Utama -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-5 rounded-2xl shadow-lg">
            <p class="text-blue-100 text-xs">Total Saldo Utama (Tabungan + Emas)</p>
            <h2 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
        </div>

        <!-- Ringkasan Pos -->
        <div class="grid grid-cols-2 gap-2">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <span class="text-[10px] text-slate-400">Tabungan Utama</span>
                <p id="saldo-utama" class="text-sm font-bold text-emerald-400 mt-0.5">Rp 0</p>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <span class="text-[10px] text-slate-400">Tabungan Anak</span>
                <p id="saldo-anak" class="text-sm font-bold text-blue-400 mt-0.5">Rp 0</p>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <span class="text-[10px] text-slate-400">Cicilan Rumah</span>
                <p id="saldo-rumah" class="text-sm font-bold text-amber-400 mt-0.5">Rp 0</p>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <span class="text-[10px] text-slate-400">Emas Antam (Gram)</span>
                <p id="saldo-emas" class="text-sm font-bold text-yellow-400 mt-0.5">0 Gram</p>
            </div>
        </div>

        <!-- Form Input Langsung (Tanpa Modal / Pasti Muncul) -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-blue-500"></i> Tambah Transaksi Baru
            </h3>
            <form id="tx-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Pilih Pos Dompet</label>
                    <select id="f-wallet" onchange="checkWallet()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="utama">Tabungan Utama</option>
                        <option value="anak">Tabungan Anak</option>
                        <option value="rumah">Cicilan Rumah</option>
                        <option value="emas">Tabungan Emas Antam</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Jenis</label>
                    <select id="f-type" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="masuk">Pemasukan / Setoran (+)</option>
                        <option value="keluar">Pengeluaran / Penarikan (-)</option>
                    </select>
                </div>
                <div>
                    <label id="label-amount" class="block text-[11px] text-slate-400 mb-1">Nominal (Rp)</label>
                    <input type="number" id="f-amount" placeholder="Contoh: 500000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Keterangan</label>
                    <input type="text" id="f-desc" placeholder="Contoh: Setoran awal / Beli emas" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-lg">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Riwayat -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h3 class="text-sm font-semibold text-white">Riwayat Transaksi</h3>
            <div id="tx-list" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-slate-500 text-xs text-center py-4">Belum ada transaksi.</p>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBw-DemoKeyForTabunganAppSyncRealtime2026",
            authDomain: "tabungan-kita-sync.firebaseapp.com",
            projectId: "tabungan-kita-sync"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        firebase.auth().signInAnonymously();

        let currentRoom = localStorage.getItem('my_room') || 'KELUARGA123';
        let globalData = { transactions: [], housePrice: 500000000 };
        let unsub = null;
        const goldPrice = 2541000;

        document.getElementById('input-room').value = currentRoom;
        document.getElementById('room-badge').innerText = currentRoom;
        connectRoom(currentRoom);

        function connectRoom(room) {
            if (unsub) unsub();
            unsub = db.collection('rooms').doc(room).onSnapshot(doc => {
                if (doc.exists) {
                    globalData = doc.data();
                } else {
                    db.collection('rooms').doc(room).set({ transactions: [], housePrice: 500000000 });
                    globalData = { transactions: [], housePrice: 500000000 };
                }
                render();
            });
        }

        function changeRoom() {
            let val = document.getElementById('input-room').value.trim().toUpperCase();
            if (!val) return alert('Masukkan kode room!');
            currentRoom = val;
            localStorage.setItem('my_room', currentRoom);
            document.getElementById('room-badge').innerText = currentRoom;
            connectRoom(currentRoom);
        }

        function checkWallet() {
            let w = document.getElementById('f-wallet').value;
            let lbl = document.getElementById('label-amount');
            let inp = document.getElementById('f-amount');
            if (w === 'emas') {
                lbl.innerText = "Jumlah Gram Emas (gr)";
                inp.placeholder = "Contoh: 10";
            } else {
                lbl.innerText = "Nominal (Rp)";
                inp.placeholder = "Contoh: 500000";
            }
        }

        function addTransaction(e) {
            e.preventDefault();
            let wallet = document.getElementById('f-wallet').value;
            let type = document.getElementById('f-type').value;
            let rawAmt = Number(document.getElementById('f-amount').value);
            let desc = document.getElementById('f-desc').value;

            let newTx = {
                wallet,
                type,
                desc,
                amount: wallet === 'emas' ? rawAmt * goldPrice : rawAmt,
                grams: wallet === 'emas' ? rawAmt : 0,
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
            };

            globalData.transactions.unshift(newTx);
            db.collection('rooms').doc(currentRoom).set(globalData).then(() => {
                document.getElementById('tx-form').reset();
                checkWallet();
            }).catch(err => alert('Gagal menyimpan: ' + err.message));
        }

        function deleteTx(idx) {
            if (confirm('Hapus transaksi ini?')) {
                globalData.transactions.splice(idx, 1);
                db.collection('rooms').doc(currentRoom).set(globalData);
            }
        }

        function render() {
            let sUtama = 0, sAnak = 0, sRumah = 0, sEmas = 0;

            globalData.transactions.forEach(tx => {
                let amt = Number(tx.amount);
                if (tx.wallet === 'utama') {
                    if (tx.type === 'masuk') sUtama += amt; else sUtama -= amt;
                } else if (tx.wallet === 'anak') {
                    if (tx.type === 'masuk') sAnak += amt; else sAnak -= amt;
                } else if (tx.wallet === 'rumah') {
                    if (tx.type === 'masuk') sRumah += amt; else sRumah -= amt;
                } else if (tx.wallet === 'emas') {
                    if (tx.type === 'masuk') sEmas += Number(tx.grams || 0); else sEmas -= Number(tx.grams || 0);
                }
            });

            let nilaiEmasRupiah = sEmas * goldPrice;
            document.getElementById('total-saldo').innerText = formatRp(sUtama + nilaiEmasRupiah);
            document.getElementById('saldo-utama').innerText = formatRp(sUtama);
            document.getElementById('saldo-anak').innerText = formatRp(sAnak);
            document.getElementById('saldo-rumah').innerText = formatRp(sRumah);
            document.getElementById('saldo-emas').innerText = sEmas + " Gram (" + formatRp(nilaiEmasRupiah) + ")";

            let listEl = document.getElementById('tx-list');
            if (globalData.transactions.length === 0) {
                listEl.innerHTML = `<p class="text-slate-500 text-xs text-center py-4">Belum ada transaksi.</p>`;
            } else {
                listEl.innerHTML = globalData.transactions.map((tx, i) => `
                    <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-xs">
                        <div>
                            <p class="font-medium text-white">${tx.desc}</p>
                            <p class="text-[10px] text-slate-400 uppercase">${tx.wallet} • ${tx.date}</p>
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            <span class="font-bold ${tx.type === 'masuk' ? 'text-emerald-400' : 'text-rose-400'}">
                                ${tx.type === 'masuk' ? '+' : '-'} ${tx.wallet === 'emas' ? tx.grams + ' gr' : formatRp(tx.amount)}
                            </span>
                            <button onclick="deleteTx(${i})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function formatRp(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
        }
    </script>
</body>
</html>
