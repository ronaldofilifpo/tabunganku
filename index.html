<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabunganKita - Live Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg text-white flex items-center gap-2">
                <i class="fa-solid fa-wallet text-blue-500"></i> TabunganKita
            </h1>
            <p class="text-xs text-emerald-400 font-medium" id="sync-status">● Real-time Sync Aktif</p>
        </div>
        <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
            <span class="text-slate-400">Room:</span> <span id="room-badge" class="font-bold text-blue-400">...</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Ubah Room Code -->
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex gap-2">
            <input type="text" id="input-room" placeholder="Ketik Kode Room (Contoh: RUMAH123)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs uppercase font-mono text-white focus:outline-none focus:border-blue-500">
            <button onclick="changeRoom()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">Ganti</button>
        </div>

        <!-- Total Saldo Utama -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-5 rounded-2xl shadow-lg">
            <p class="text-blue-100 text-xs">Total Saldo Utama</p>
            <h2 id="totalBalance" class="text-3xl font-extrabold mt-1">Rp 0</h2>
            <p id="txCount" class="text-[10px] text-blue-200 mt-2">0 item</p>
        </div>

        <!-- Form Input Transaksi -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-blue-500"></i> Tambah Transaksi Baru
            </h3>
            <form id="tx-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Kategori / Pos Dompet</label>
                    <select id="txCategory" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="Tabungan">Tabungan Utama</option>
                        <option value="Pemasukan">Pemasukan Lainnya</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Nominal (Rp)</label>
                    <input type="number" id="txAmount" placeholder="Contoh: 500000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Catatan / Keterangan</label>
                    <input type="text" id="txNote" placeholder="Contoh: Setoran bulanan" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-lg">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Riwayat -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h3 class="text-sm font-semibold text-white">Riwayat Transaksi</h3>
            <div id="transactionList" class="divide-y divide-slate-800 max-h-60 overflow-y-auto space-y-2">
                <p class="text-slate-500 text-xs text-center py-4">Belum ada data transaksi di room ini.</p>
            </div>
        </div>

    </main>

    <!-- Script Utama (Firebase + LocalStorage + Sync) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBw-DemoKeyForTabunganAppSyncRealtime2026",
            authDomain: "tabungan-kita-sync.firebaseapp.com",
            projectId: "tabungan-kita-sync"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        firebase.auth().signInAnonymously();

        let currentRoom = localStorage.getItem('tabungku_room') || 'KELUARGA123';
        let transactions = [];
        let unsub = null;

        document.getElementById('input-room').value = currentRoom;
        document.getElementById('room-badge').innerText = currentRoom;
        initRealtimeSync(currentRoom);

        function getRoomId() {
            return currentRoom;
        }

        // Inisialisasi Tampilan Aplikasi & Simpan ke Memori Lokal HP
        function initApp() {
            const listEl = document.getElementById('transactionList');
            const balanceEl = document.getElementById('totalBalance');
            const countEl = document.getElementById('txCount');
            
            listEl.innerHTML = '';
            let total = 0;
            
            // Simpan ke localStorage agar tidak hilang saat refresh
            localStorage.setItem('tabungku_transactions', JSON.stringify(transactions));

            if (!Array.isArray(transactions) || transactions.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-4 text-sm">Belum ada data transaksi di room ini.</p>`;
                balanceEl.innerText = 'Rp 0';
                countEl.innerText = '0 item';
                return;
            }

            countEl.innerText = `${transactions.length} item`;

            transactions.forEach(tx => {
                let amountNum = Number(tx.amount) || 0;
                if (tx.category === 'Pemasukan' || tx.category === 'Tabungan') {
                    total += amountNum;
                } else {
                    total -= amountNum;
                }

                let itemHTML = `
                    <div class="py-2.5 flex justify-between items-center text-sm">
                        <div>
                            <p class="font-semibold text-white">${tx.note || tx.category || 'Transaksi'}</p>
                            <p class="text-xs text-slate-400">${new Date(tx.date).toLocaleDateString('id-ID')} • <span class="text-blue-400 font-medium">${tx.category}</span></p>
                        </div>
                        <span class="font-bold ${tx.category === 'Pengeluaran' ? 'text-red-400' : 'text-emerald-400'}">
                            ${tx.category === 'Pengeluaran' ? '-' : '+'} Rp ${amountNum.toLocaleString('id-ID')}
                        </span>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });

            balanceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // Sinkronisasi Real-time dengan Firebase Firestore
        function initRealtimeSync(room) {
            if (unsub) unsub();
            unsub = db.collection('rooms').doc(room).onSnapshot(doc => {
                if (doc.exists) {
                    let data = doc.data();
                    transactions = data.transactions || [];
                } else {
                    db.collection('rooms').doc(room).set({ transactions: [] });
                    transactions = [];
                }
                initApp();
            }, err => {
                console.error('Error sync:', err);
                let localData = localStorage.getItem('tabungku_transactions');
                if (localData) {
                    transactions = JSON.parse(localData);
                    initApp();
                }
            });
        }

        function changeRoom() {
            let val = document.getElementById('input-room').value.trim().toUpperCase();
            if (!val) return alert('Masukkan kode room!');
            currentRoom = val;
            localStorage.setItem('tabungku_room', currentRoom);
            document.getElementById('room-badge').innerText = currentRoom;
            initRealtimeSync(currentRoom);
        }

        // Handle Form Submit (Simpan lokal & kirim ke Cloud/Firebase)
        function handleFormSubmit(e) {
            e.preventDefault();
            const amount = document.getElementById('txAmount').value;
            const category = document.getElementById('txCategory').value;
            const note = document.getElementById('txNote').value;

            const newTx = {
                id: 'tx_' + new Date().getTime(),
                date: new Date().toISOString(),
                amount: Number(amount),
                category: category,
                note: note || category
            };

            transactions.push(newTx);
            localStorage.setItem('tabungku_transactions', JSON.stringify(transactions));
            
            initApp();

            // Kirim ke Firebase Cloud agar HP ke-2 ikut berubah
            db.collection('rooms').doc(currentRoom).set({
                transactions: transactions
            }).then(() => {
                document.getElementById('tx-form').reset();
            }).catch(err => alert('Gagal kirim ke cloud: ' + err.message));
        }

        // Saat halaman dimuat pertama kali
        document.addEventListener('DOMContentLoaded', () => {
            let localData = localStorage.getItem('tabungku_transactions');
            if (localData) {
                transactions = JSON.parse(localData);
                initApp();
            }
        });
    </script>
</body>
</html>
